<style>
  :root { --ink: #212121; --muted: #737373; --blue: #3263b8; --line: #e8e8e8; --red: #e3350d; --soft: #f4f4f4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: "Fira Sans", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; }

  header { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.96);
    border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .top { display: flex; align-items: center; gap: 10px; max-width: 1200px; margin: 0 auto; }
  .ball { width: 30px; height: 30px; border-radius: 50%; flex: none; position: relative;
    background: linear-gradient(var(--ink) 0 0) center/100% 3px no-repeat, linear-gradient(var(--red) 50%, #fff 50%);
    border: 3px solid var(--ink); }
  .ball::after { content: ""; position: absolute; inset: 0; margin: auto; width: 8px; height: 8px;
    border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: var(--blue); }
  .count { margin-left: auto; font-size: 15px; color: var(--muted); white-space: nowrap; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1200px; margin: 10px auto 0; }
  .controls input, .controls select { font: inherit; font-size: 17px; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; background: var(--soft); color: var(--ink); min-width: 0; }
  .controls input { flex: 1 1 220px; }
  .tabs { display: flex; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tabs button { font: inherit; font-size: 17px; border: 0; border-radius: 8px; padding: 5px 14px;
    background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: #fff; color: var(--blue); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .grid { display: grid; gap: 28px 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .mon { text-align: center; cursor: pointer; position: relative; border-radius: 14px; padding: 6px 4px 8px; }
  .mon:focus-visible { outline: 2px solid var(--blue); }
  @media (hover: hover) { .mon:hover { background: var(--soft); } }
  .mon img { width: 100%; max-width: 170px; aspect-ratio: 1; object-fit: contain; display: block; margin: 0 auto; }
  .num { color: var(--muted); font-size: 17px; margin-top: 4px; }
  .name { color: var(--blue); font-weight: 700; font-size: 21px; line-height: 1.2; }
  .types { font-size: 18px; text-transform: capitalize; }
  .dot { color: var(--muted); margin: 0 4px; }
  .mon .heart { position: absolute; top: 6px; right: 8px; font-size: 22px; color: var(--red); display: none; }
  .mon.fav .heart { display: block; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 20px; }

  .modal { position: fixed; inset: 0; background: rgba(20,20,25,.55); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal.open { display: flex; }
  .big { background: #fff; border-radius: 24px; padding: 18px 20px 20px; width: min(480px, 100%);
    max-height: 100%; overflow: auto; text-align: center; position: relative; }
  .stage { width: 100%; max-width: 380px; aspect-ratio: 1; margin: 0 auto; }
  .stage img, .stage model-viewer { width: 100%; height: 100%; object-fit: contain; display: block; }
  model-viewer { --poster-color: transparent; }
  .big .num { font-size: 20px; }
  .big .name { font-size: 34px; }
  .big .types { font-size: 22px; }
  .row { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 18px; font-weight: 500; border: 2px solid var(--line); border-radius: 999px;
    padding: 8px 20px; min-height: 46px; cursor: pointer; background: #fff; color: var(--ink); transition: transform .15s; }
  .btn.save { border-color: var(--red); color: var(--red); }
  .btn.save.on { background: var(--red); color: #fff; }
  .btn.three.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.pop { transform: scale(1.15); }
  .nav { display: flex; justify-content: space-between; margin-top: 14px; }
  .close { position: absolute; top: 12px; right: 12px; z-index: 1; padding: 4px 14px; }
  .hint { color: var(--muted); font-size: 14px; height: 18px; }
</style>

const TYPE_COLORS = {
  normal:"#7a7a63", fire:"#e5711f", water:"#3b7be0", electric:"#c9a200", grass:"#4f9e37", ice:"#3fb1d9",
  fighting:"#a8473a", poison:"#9b3e9b", ground:"#b8913a", flying:"#7d6ee0", psychic:"#e8457a", bug:"#8a9a1b",
  rock:"#a08c35", ghost:"#6b5596", dragon:"#6237e0", dark:"#6b5446", steel:"#7f8aa3", fairy:"#d96fd0"
};
const SPRITES = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other";
const pic = n => `${SPRITES}/home/${n}.png`;
const model = n => `https://raw.githubusercontent.com/Pokemon-3D-api/assets/main/models/opt/regular/${n}.glb`;
const pad = n => "#" + String(n).padStart(4, "0");
const typeText = ts => ts.map(t => `<span style="color:${TYPE_COLORS[t]}">${t}</span>`).join('<span class="dot">·</span>');

const $ = id => document.getElementById(id);
const grid = $("grid");

// Favorites are saved on this device, so they are still there next time.
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("favorites") || "[]")); } catch {}
function saveFavs() { try { localStorage.setItem("favorites", JSON.stringify([...favs])); } catch {} }
let favMode = false;

for (const t of Object.keys(TYPE_COLORS).sort()) $("type").add(new Option(t[0].toUpperCase() + t.slice(1), t));
for (let g = 1; g <= Math.max(...POKEMON.map(p => p[3])); g++) $("gen").add(new Option("Generation " + g, g));

let shown = [];
function render() {
  const q = $("q").value.trim().toLowerCase().replace(/^#/, "");
  const type = $("type").value, gen = +$("gen").value;
  shown = POKEMON.filter(([n, name, , g, ts]) =>
    (!q || name.toLowerCase().includes(q) || String(n) === String(+q)) &&
    (!type || ts.includes(type)) && (!gen || g === gen) && (!favMode || favs.has(n)));
  grid.innerHTML = shown.map(([n, name, , , ts], i) => `
    <div class="mon${favs.has(n) ? " fav" : ""}" tabindex="0" data-i="${i}">
      <span class="heart">♥</span>
      <img loading="lazy" src="${pic(n)}" alt="${name}">
      <div class="num">${pad(n)}</div>
      <div class="name">${name}</div>
      <div class="types">${typeText(ts)}</div>
    </div>`).join("");
  $("empty").hidden = shown.length > 0;
  $("empty").textContent = favMode && favs.size === 0
    ? "No favorites yet! Tap a Pokémon, then tap ♡ Save." : "No Pokémon found!";
  $("count").textContent = `${shown.length} Pokémon`;
  updateFavTab();
}
const updateFavTab = () => $("tabFav").textContent = `♥ Favorites (${favs.size})`;

let current = 0, show3D = false;
function openBig(i) {
  current = (i + shown.length) % shown.length;
  const [n, name, , , ts] = shown[current];
  const can3D = HAS_3D.has(n);
  $("stage").innerHTML = show3D && can3D
    ? `<model-viewer src="${model(n)}" poster="${pic(n)}" alt="${name}" camera-controls auto-rotate
         touch-action="none" interaction-prompt="none" shadow-intensity="1" exposure="1.1"><div slot="progress-bar"></div></model-viewer>`
    : `<img src="${pic(n)}" alt="${name}">`;
  $("hint").textContent = show3D && can3D ? "Drag to spin · pinch to zoom" : "";
  $("three").hidden = !can3D;
  $("three").classList.toggle("on", show3D);
  $("bigNum").textContent = pad(n);
  $("bigName").textContent = name;
  $("bigTypes").innerHTML = typeText(ts);
  showSave();
  $("modal").classList.add("open");
}
function showSave() {
  const on = favs.has(shown[current][0]);
  $("save").textContent = on ? "♥ Saved!" : "♡ Save";
  $("save").classList.toggle("on", on);
}
function pop(el) { el.classList.add("pop"); setTimeout(() => el.classList.remove("pop"), 150); }

$("save").onclick = () => {
  const n = shown[current][0];
  favs.has(n) ? favs.delete(n) : favs.add(n);
  saveFavs(); showSave(); pop($("save"));
  const el = grid.querySelector(`[data-i="${current}"]`);
  if (el) el.classList.toggle("fav", favs.has(n));
  updateFavTab();
};
$("three").onclick = () => { show3D = !show3D; openBig(current); };

// Redraw on close so an un-saved Pokémon leaves the Favorites list.
const closeBig = () => { $("modal").classList.remove("open"); $("stage").innerHTML = ""; if (favMode) render(); };

grid.addEventListener("click", e => { const c = e.target.closest(".mon"); if (c) openBig(+c.dataset.i); });
grid.addEventListener("keydown", e => { const c = e.target.closest(".mon"); if (c && e.key === "Enter") openBig(+c.dataset.i); });
$("prev").onclick = () => openBig(current - 1);
$("next").onclick = () => openBig(current + 1);
$("close").onclick = closeBig;
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeBig(); });
document.addEventListener("keydown", e => {
  if (!$("modal").classList.contains("open")) return;
  if (e.key === "ArrowLeft") openBig(current - 1);
  if (e.key === "ArrowRight") openBig(current + 1);
  if (e.key === "Escape") closeBig();
});

// Swipe left/right in the pop-up to flip through Pokémon (not while spinning a 3D model).
let touchX = null;
$("modal").addEventListener("touchstart", e => {
  touchX = e.target.closest("model-viewer") ? null : e.touches[0].clientX;
}, { passive: true });
$("modal").addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) openBig(current + (dx < 0 ? 1 : -1));
});

function setTab(fav) {
  favMode = fav;
  $("tabAll").classList.toggle("on", !fav); $("tabFav").classList.toggle("on", fav);
  render(); window.scrollTo(0, 0);
}
$("tabAll").onclick = () => setTab(false);
$("tabFav").onclick = () => setTab(true);
for (const id of ["q", "type", "gen"]) $(id).addEventListener("input", render);
render();
</script>
